services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--bind", "0.0.0.0", "--port", "${REDIS_PORT:-6379}"]
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    networks:
      - roudelafortune_net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT:-6379}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        PORT: ${PORT:-8000}
    command: >
      sh -c "
      export PORT=${PORT:-8000};
      if [ \"${APP_MODE:-dev}\" = \"prod\" ]; then
        exec uwsgi --ini uwsgi.ini;
      else
        exec flask --app app run --host 0.0.0.0 --port ${PORT:-8000} --debug --no-reload --with-threads;
      fi
      "
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=${PORT:-8000}
      - APP_MODE=${APP_MODE:-dev}
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - roudelafortune_net
    restart: unless-stopped

volumes:
  redis_data:

networks:
  roudelafortune_net:
    driver: bridge
