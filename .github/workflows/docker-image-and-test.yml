name: Docker Image and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
    build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag my-image-name:ci
      - name: Sauvegarder l'image
        run: docker save my-image-name:ci -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          
  web_test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Charger l'image
        run: docker load -i image.tar
      - name: Run the Docker image
        run: docker run -d -p 8000:8000 my-image-name:ci
      - name: test-web-accessibility
        uses: harryzhou1987/test-web-accessibility@v0.0.1
        with:
          URLs: |
            "http://127.0.0.1:8000"
          ERROR_THRESHOLD: 0
